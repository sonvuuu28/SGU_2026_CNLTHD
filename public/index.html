<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Excel to PDF Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader { border-top-color: #10b981; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-6">
    <div class="max-w-xl w-full bg-slate-800 border border-slate-700 shadow-2xl rounded-2xl p-8">
        
        <div id="uploadSection">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-extrabold text-blue-400">Excel to PDF Worker</h1>
                <p class="text-slate-400 mt-2">Xử lý an toàn - Nén ZIP chuẩn UTF-8</p>
            </div>

            <div class="border-2 border-dashed border-slate-600 rounded-lg p-10 text-center hover:border-blue-500 transition-all mb-6">
                <input type="file" id="fileInput" multiple accept=".xlsx" class="hidden">
                <label for="fileInput" class="cursor-pointer">
                    <div class="text-slate-500 mb-2">📁</div>
                    <span id="fileCount" class="text-slate-300 font-medium">Chọn các file Excel (.xlsx)</span>
                </label>
            </div>

            <button onclick="startProcess()" id="mainBtn" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-xl font-bold shadow-lg transition active:scale-95">
                BẮT ĐẦU CHUYỂN ĐỔI
            </button>
        </div>

        <div id="statusSection" class="hidden text-center py-10">
            <div id="loadingUI">
                <div class="loader ease-linear rounded-full border-4 border-slate-700 h-12 w-12 mb-4 mx-auto"></div>
                <p class="text-emerald-400 animate-pulse">Đang chuyển đổi từng file bằng Worker...</p>
            </div>

            <div id="finishUI" class="hidden">
                <div class="bg-emerald-900/20 border border-emerald-500/50 p-6 rounded-xl">
                    <p class="text-emerald-400 font-bold text-xl mb-6">Xử lý hoàn tất!</p>
                    
                    <div class="flex flex-col gap-4">
                        <a id="zipBtn" href="#" class="bg-emerald-500 text-slate-900 px-8 py-3 rounded-lg font-bold hover:bg-emerald-400 shadow-lg">
                            📥 TẢI XUỐNG FILE .ZIP
                        </a>
                        
                        <button onclick="resetApp()" class="text-slate-400 hover:text-white underline text-sm">
                            Làm mới để convert file khác
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const fileCountText = document.getElementById('fileCount');
        const uploadSection = document.getElementById('uploadSection');
        const statusSection = document.getElementById('statusSection');
        const loadingUI = document.getElementById('loadingUI');
        const finishUI = document.getElementById('finishUI');
        const zipBtn = document.getElementById('zipBtn');

        fileInput.addEventListener('change', () => {
            const count = fileInput.files.length;
            fileCountText.innerText = count > 0 ? `Đã chọn ${count} file` : "Chọn các file Excel (.xlsx)";
        });

        async function startProcess() {
            if (fileInput.files.length === 0) return alert('Bạn chưa chọn!');

            const fd = new FormData();
            for (let f of fileInput.files) fd.append('excelFiles', f);

            uploadSection.classList.add('hidden');
            statusSection.classList.remove('hidden');
            loadingUI.classList.remove('hidden');
            finishUI.classList.add('hidden');

            try {
                const res = await fetch('/upload', { method: 'POST', body: fd });
                const data = await res.json();

                if (data.zipUrl) {
                    loadingUI.classList.add('hidden');
                    finishUI.classList.remove('hidden');
                    zipBtn.href = data.zipUrl;
                }
            } catch (err) {
                alert('Lỗi: ' + err.message);
                resetApp();
            }
        }

        function resetApp() {
            // Reset dữ liệu input
            fileInput.value = "";
            fileCountText.innerText = "Chọn các file Excel (.xlsx)";
            
            // Quay lại màn hình upload
            uploadSection.classList.remove('hidden');
            statusSection.classList.add('hidden');
            loadingUI.classList.add('hidden');
            finishUI.classList.add('hidden');
        }
    </script>
</body>
</html>
